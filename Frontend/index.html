<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Saaluvesa Enterprises Pvt Ltd</title>
    <link rel="icon" type="image/jpeg" href="/favicon.jpeg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap"
      rel="stylesheet"
    />

    <style>
      /* Completely hide ONLY the Google Translate top banner frame & hover tooltip */
      .goog-te-banner-frame,
      .goog-te-banner-frame.skiptranslate,
      iframe.goog-te-banner-frame,
      iframe[id=":1.container"],
      iframe[id=":2.container"],
      #goog-gt-tt,
      .goog-te-balloon-frame,
      .goog-te-ftab-float {
        display: none !important;
        visibility: hidden !important;
        height: 0px !important;
        max-height: 0px !important;
        min-height: 0px !important;
        opacity: 0 !important;
        position: fixed !important;
        top: -99999px !important;
        left: -99999px !important;
        border: none !important;
        pointer-events: none !important;
        z-index: -999999 !important;
      }

      /* Prevent Google Translate from shifting the layout */
      html {
        top: 0px !important;
      }
      body {
        top: 0px !important;
        position: static !important;
      }
      html.translated-ltr,
      html.translated-rtl,
      body.translated-ltr,
      body.translated-rtl {
        top: 0px !important;
        margin-top: 0px !important;
        padding-top: 0px !important;
      }

      /* Off-screen container for Google Translate widget */
      #google_translate_element {
        position: absolute !important;
        top: -9999px !important;
        left: -9999px !important;
        width: 1px !important;
        height: 1px !important;
        overflow: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Google Translate Host Element -->
    <div id="google_translate_element"></div>

    <script>
      window.clearGoogleTranslateCookie = function() {
        var host = location.hostname;
        var hostParts = host.split('.');
        var domains = ['', host, '.' + host];
        if (hostParts.length > 2) {
          var rootDomain = hostParts.slice(-2).join('.');
          domains.push(rootDomain);
          domains.push('.' + rootDomain);
        }
        var paths = ['/', location.pathname];
        var expiry = 'expires=Thu, 01 Jan 1970 00:00:00 UTC; Max-Age=0';

        for (var i = 0; i < domains.length; i++) {
          for (var j = 0; j < paths.length; j++) {
            var dom = domains[i] ? '; domain=' + domains[i] : '';
            document.cookie = 'googtrans=; ' + expiry + '; path=' + paths[j] + dom;
            document.cookie = 'googtrans=/en/en; path=' + paths[j] + dom;
          }
        }
      };

      window.setGoogTransCookie = function(langCode) {
        if (!langCode || langCode === 'en') {
          window.clearGoogleTranslateCookie();
          return;
        }
        var val = '/en/' + langCode;
        var host = location.hostname;
        var hostParts = host.split('.');
        var domains = ['', host, '.' + host];
        if (hostParts.length > 2) {
          var rootDomain = hostParts.slice(-2).join('.');
          domains.push(rootDomain);
          domains.push('.' + rootDomain);
        }
        var paths = ['/'];

        for (var i = 0; i < domains.length; i++) {
          for (var j = 0; j < paths.length; j++) {
            var dom = domains[i] ? '; domain=' + domains[i] : '';
            document.cookie = 'googtrans=' + val + '; path=' + paths[j] + dom;
          }
        }
      };

      (function () {
        // Restore saved language cookie BEFORE widget initialises
        var savedLang = '';
        try { savedLang = localStorage.getItem('saalu_selected_lang') || ''; } catch(e) {}

        if (savedLang && savedLang !== 'en') {
          window.setGoogTransCookie(savedLang);
        } else {
          window.clearGoogleTranslateCookie();
        }

        function hideBanner(node) {
          if (node && node.nodeType === 1) {
            if (
              node.classList.contains('goog-te-banner-frame') ||
              node.id === 'goog-gt-tt' ||
              node.id === ':1.container' ||
              node.id === ':2.container'
            ) {
              node.style.setProperty('display', 'none', 'important');
              node.style.setProperty('visibility', 'hidden', 'important');
              node.style.setProperty('height', '0px', 'important');
              node.style.setProperty('top', '-99999px', 'important');
            }
          }
        }

        var obs = new MutationObserver(function (mutations) {
          for (var i = 0; i < mutations.length; i++) {
            var added = mutations[i].addedNodes;
            for (var j = 0; j < added.length; j++) {
              hideBanner(added[j]);
            }
          }
          if (document.body && document.body.style.top && document.body.style.top !== '0px') {
            document.body.style.top = '0px';
          }
        });

        if (document.body) {
          obs.observe(document.body, { childList: true });
        } else {
          document.addEventListener('DOMContentLoaded', function () {
            obs.observe(document.body, { childList: true });
          });
        }
      })();

      function googleTranslateElementInit() {
        new google.translate.TranslateElement(
          {
            pageLanguage: 'en',
            includedLanguages: 'en,sq,ca,hy,de,az,be,ru,nl,fr,bs,hr,sr,bg,el,tr,cs,da,et,fi,sv,ka,hu,is,ga,it,kk,lv,lt,lb,mt,ro,mk,no,pl,pt,sk,sl,es,gl,eu,oc,uk,cy,gd,la',
            autoDisplay: false,
          },
          'google_translate_element'
        );

        // After the widget initialises, if a language was saved, trigger it again
        // via the combo select so every page element gets translated.
        var lang = '';
        try { lang = localStorage.getItem('saalu_selected_lang') || ''; } catch(e) {}
        if (lang && lang !== 'en') {
          var attempts = 0;
          var applyInterval = setInterval(function() {
            var sel = document.querySelector('.goog-te-combo');
            if (sel && sel.options && sel.options.length > 1) {
              sel.value = lang;
              sel.dispatchEvent(new Event('change', { bubbles: true }));
              clearInterval(applyInterval);
            } else if (++attempts > 30) {
              clearInterval(applyInterval);
            }
          }, 200);
        }
      }

      window.triggerGoogleTranslate = function (langCode) {
        var aliasMap = {
          'ca-valencia': 'ca',
          'cnr': 'sr',
          'nn': 'no',
          'se': 'no',
          'rm': 'de'
        };
        var targetCode = aliasMap[langCode] || langCode;

        var select = document.querySelector('.goog-te-combo');
        if (!select) return false;

        var targetIndex = -1;
        for (var i = 0; i < select.options.length; i++) {
          var opt = select.options[i];
          if (targetCode === 'en' || langCode === 'en') {
            if (opt.value === '' || opt.value === 'en' || opt.text.toLowerCase().indexOf('select') !== -1 || opt.text.toLowerCase().indexOf('english') !== -1) {
              targetIndex = i;
              break;
            }
          } else {
            if (opt.value.toLowerCase() === targetCode.toLowerCase() || opt.value.toLowerCase() === langCode.toLowerCase()) {
              targetIndex = i;
              break;
            }
          }
        }

        if (targetIndex !== -1) {
          select.selectedIndex = targetIndex;
          select.value = select.options[targetIndex].value;
          select.options[targetIndex].selected = true;
        } else {
          select.value = (targetCode === 'en') ? '' : targetCode;
        }

        try {
          select.dispatchEvent(new Event('change', { bubbles: true, cancelable: true }));
        } catch (e) {}

        return true;
      };
    </script>
    <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" async defer></script>
  </body>
</html>
