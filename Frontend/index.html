<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Saaluvesa Enterprises Pvt Ltd</title>
    <link rel="icon" type="image/jpeg" href="/favicon.jpeg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap"
      rel="stylesheet"
    />

    <style>
      /* Completely hide the Google Translate banner/toolbar */
      .goog-te-banner-frame,
      .goog-te-banner-frame.skiptranslate,
      iframe.goog-te-banner-frame,
      iframe[id=":1.container"],
      iframe[id=":2.container"],
      #goog-gt-tt,
      .goog-te-balloon-frame,
      .goog-te-ftab-float {
        display: none !important;
        visibility: hidden !important;
        height: 0px !important;
        max-height: 0px !important;
        min-height: 0px !important;
        opacity: 0 !important;
        position: fixed !important;
        top: -99999px !important;
        left: -99999px !important;
        border: none !important;
        pointer-events: none !important;
        z-index: -999999 !important;
      }

      /* Prevent Google Translate from shifting body down */
      html { top: 0px !important; }
      body { top: 0px !important; position: static !important; }
      html.translated-ltr, html.translated-rtl,
      body.translated-ltr, body.translated-rtl {
        top: 0px !important;
        margin-top: 0px !important;
        padding-top: 0px !important;
      }

      /* Hide the Google Translate widget container */
      #google_translate_element {
        position: absolute !important;
        top: -9999px !important;
        left: -9999px !important;
        width: 1px !important;
        height: 1px !important;
        overflow: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Google Translate Host Element -->
    <div id="google_translate_element"></div>

    <script>
      // ─────────────────────────────────────────────────────────────────────────
      // SAALUVESA TRANSLATION ENGINE  v3.0
      // Single source of truth: localStorage('saalu_selected_lang')
      // googtrans cookie is always derived FROM localStorage, never the reverse.
      // ─────────────────────────────────────────────────────────────────────────

      // Verified Google Translate code map for dialect/regional codes
      var GT_CODE_MAP = {
        'ca-valencia': 'ca',   // Valencian → Catalan (closest supported)
        'cnr':         'sr',   // Montenegrin → Serbian (closest supported)
        'nn':          'no',   // Norwegian Nynorsk → Norwegian Bokmål
        'se':          'no',   // Northern Sami → Norwegian (closest supported)
        'rm':          'it',   // Romansh → Italian (closest supported; 'rm' not in GT)
      };

      // Resolve app language code → verified Google Translate code
      function gtCode(code) {
        if (!code || code === 'en') return 'en';
        return GT_CODE_MAP[code] || code;
      }

      // ── Cookie helpers ────────────────────────────────────────────────────────
      // Get all possible domain variations for reliable cookie deletion
      function _cookieDomains() {
        var host = location.hostname;
        var parts = host.split('.');
        var list = ['', host];
        if (host !== 'localhost') list.push('.' + host);
        if (parts.length > 2) {
          var root = parts.slice(-2).join('.');
          list.push(root, '.' + root);
        }
        return list;
      }

      // Wipe ALL variants of the googtrans cookie
      window.clearGoogleTranslateCookie = function () {
        var exp = 'expires=Thu, 01 Jan 1970 00:00:00 UTC; max-age=0; path=/';
        _cookieDomains().forEach(function (d) {
          var dom = d ? '; domain=' + d : '';
          document.cookie = 'googtrans=; ' + exp + dom;
          document.cookie = 'googtrans=; ' + exp + dom + '; path=/ ';
        });
        // Also clear without any domain attribute
        document.cookie = 'googtrans=; ' + exp;
      };

      // Set googtrans cookie to /en/<targetCode> across all domain scopes
      window.setGoogTransCookie = function (langCode) {
        var tc = gtCode(langCode);
        if (!tc || tc === 'en') {
          window.clearGoogleTranslateCookie();
          return;
        }
        window.clearGoogleTranslateCookie(); // wipe stale values first
        var val = '/en/' + tc;
        var base = 'path=/; samesite=lax';
        _cookieDomains().forEach(function (d) {
          var dom = d ? '; domain=' + d : '';
          document.cookie = 'googtrans=' + val + '; ' + base + dom;
        });
        document.cookie = 'googtrans=' + val + '; ' + base;
      };

      // Read the current googtrans cookie value (returns '' if unset)
      function _readGoogTransCookie() {
        var match = document.cookie.match(/(?:^|;\s*)googtrans=([^;]+)/);
        return match ? decodeURIComponent(match[1]) : '';
      }

      // ── LocalStorage helper (safe) ────────────────────────────────────────────
      function _lsGet(key) {
        try { return localStorage.getItem(key) || ''; } catch (e) { return ''; }
      }
      function _lsSet(key, val) {
        try { localStorage.setItem(key, val); } catch (e) {}
      }

      // ── BOOT SEQUENCE ─────────────────────────────────────────────────────────
      // Run immediately, synchronously, before the Google Translate script loads.
      // localStorage is the single source of truth.
      (function boot() {
        var savedLang = _lsGet('saalu_selected_lang');

        // Treat empty / missing / 'en' as English
        if (!savedLang || savedLang === 'en') {
          // Force-clear any stale googtrans cookie that may survive from a
          // previous session where a foreign language was selected.
          window.clearGoogleTranslateCookie();
          // Write 'en' to make the state explicit
          _lsSet('saalu_selected_lang', 'en');
        } else {
          // Non-English: set the cookie NOW so Google Translate picks it up
          // at widget initialization time (before the page content renders).
          window.setGoogTransCookie(savedLang);
        }

        // ── Layout-shift guard ──────────────────────────────────────────────
        function hideBannerNode(node) {
          if (!node || node.nodeType !== 1) return;
          var hide = node.classList && (
            node.classList.contains('goog-te-banner-frame') ||
            node.classList.contains('goog-te-balloon-frame')
          ) || node.id === 'goog-gt-tt' ||
             node.id === ':1.container' ||
             node.id === ':2.container';
          if (hide) {
            node.style.cssText = 'display:none!important;visibility:hidden!important;height:0!important;top:-99999px!important;';
          }
        }

        var layoutObs = new MutationObserver(function (mutations) {
          for (var mi = 0; mi < mutations.length; mi++) {
            var added = mutations[mi].addedNodes;
            for (var ni = 0; ni < added.length; ni++) {
              hideBannerNode(added[ni]);
            }
          }
          // Prevent body.top shift injected by Google Translate
          if (document.body && document.body.style.top && document.body.style.top !== '0px') {
            document.body.style.removeProperty('top');
          }
        });

        function startLayoutObs() {
          layoutObs.observe(document.body, { childList: true, subtree: false });
        }

        if (document.body) {
          startLayoutObs();
        } else {
          document.addEventListener('DOMContentLoaded', startLayoutObs);
        }
      })();

      // ── Google Translate widget init callback ─────────────────────────────────
      function googleTranslateElementInit() {
        try {
          new google.translate.TranslateElement(
            { pageLanguage: 'en', autoDisplay: false },
            'google_translate_element'
          );
        } catch (e) {
          console.warn('[Saalu] Google Translate init error:', e);
        }

        // After the widget initializes, re-apply any saved non-English language.
        // We wait for .goog-te-combo to appear (it's injected asynchronously).
        var savedLang = _lsGet('saalu_selected_lang');
        if (!savedLang || savedLang === 'en') return;

        var tc = gtCode(savedLang);
        var tries = 0;
        var maxTries = 40; // 40 × 250ms = 10s max wait

        var waitForCombo = setInterval(function () {
          tries++;
          var sel = document.querySelector('.goog-te-combo');
          if (sel && sel.options && sel.options.length > 1) {
            clearInterval(waitForCombo);
            // Find matching option
            var idx = -1;
            for (var i = 0; i < sel.options.length; i++) {
              var v = (sel.options[i].value || '').toLowerCase();
              if (v === tc.toLowerCase()) { idx = i; break; }
            }
            if (idx !== -1) {
              sel.selectedIndex = idx;
              sel.value = sel.options[idx].value;
              sel.options[idx].selected = true;
              sel.dispatchEvent(new Event('change', { bubbles: true, cancelable: true }));
            }
            // If option not found in combo (language not supported by GT), do nothing
          } else if (tries >= maxTries) {
            clearInterval(waitForCombo);
            console.warn('[Saalu] .goog-te-combo not ready after', tries, 'attempts for lang:', savedLang);
          }
        }, 250);
      }

      // ── Live trigger (called by React LanguageSelector) ───────────────────────
      // Returns true if the combo select was found and updated, false otherwise.
      window.triggerGoogleTranslate = function (langCode) {
        var tc = gtCode(langCode);
        var sel = document.querySelector('.goog-te-combo');
        if (!sel || !sel.options || sel.options.length === 0) return false;

        var idx = -1;
        for (var i = 0; i < sel.options.length; i++) {
          var v = (sel.options[i].value || '').toLowerCase();
          if (tc === 'en' || langCode === 'en') {
            // Restore English: find the "Select Language" / empty / "en" option
            if (v === '' || v === 'en' ||
                sel.options[i].text.toLowerCase().indexOf('select') !== -1 ||
                sel.options[i].text.toLowerCase().indexOf('english') !== -1) {
              idx = i; break;
            }
          } else {
            if (v === tc.toLowerCase()) { idx = i; break; }
          }
        }

        if (idx === -1) {
          // Language not found in combo — do NOT select random option
          console.warn('[Saalu] Language not found in GT combo:', langCode, '(tc=' + tc + ')');
          return false;
        }

        sel.selectedIndex = idx;
        sel.value = sel.options[idx].value;
        sel.options[idx].selected = true;
        sel.dispatchEvent(new Event('change', { bubbles: true, cancelable: true }));
        return true;
      };
    </script>

    <script
      src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"
      async
      defer
    ></script>
  </body>
</html>
